---
# yamllint disable rule:line-length
name: build

# yamllint thinks bare `on:` is a YAML 1.1 boolean; quote it to silence.
"on":
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  ghcr:
    name: build & push to ghcr.io
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :latest is what production pulls; :<short-sha> pins a commit for rollback.
          tags: |
            ghcr.io/${{ github.repository_owner }}/cnc-facing:latest
            ghcr.io/${{ github.repository_owner }}/cnc-facing:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: redeploy via Komodo
    needs: ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The image exists now, so Komodo's pull gets the new build. Only this
      # one path is reachable on hook.nottseter.no (see mett-deploy's Caddyfile).
      - name: Trigger the cnc-facing stack deploy
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST \
            -H "X-Gitlab-Token: ${KOMODO_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}' \
            https://hook.nottseter.no/listener/gitlab/stack/cnc-facing/deploy
